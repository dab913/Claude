# For Rancher Monitoring (rancher-monitoring / kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ptk
  namespace: ptk-system
spec:
  selector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [ptk-node-check, ptk-audit, ptk-health]}
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
      # Keep ptk's own namespace/pvc labels (the PVC's namespace) instead of
      # renaming them to exported_namespace; alerts join on them.
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ptk
  namespace: ptk-system
spec:
  groups:
    - name: ptk.node
      rules:
        - alert: PtkDuplicateIscsiInitiator
          expr: count by (iqn) (ptk_node_iscsi_initiator_info) > 1
          labels: {severity: critical}
          annotations:
            summary: "{{ $value }} nodes share iSCSI initiator {{ $labels.iqn }}"
            description: >-
              Usually VMs cloned from one vCenter template. The array treats them as one
              host, so volumes can attach to the wrong node and get corrupted. Regenerate with
              `echo "InitiatorName=$(iscsi-iname)" > /etc/iscsi/initiatorname.iscsi` and restart iscsid.
        - alert: PtkDuplicateNvmeHostNqn
          expr: count by (hostnqn) (ptk_node_nvme_hostnqn_info) > 1
          labels: {severity: critical}
          annotations:
            summary: "{{ $value }} nodes share NVMe host NQN {{ $labels.hostnqn }}"
        - alert: PtkDuplicateMachineId
          expr: count by (machine_id) (ptk_node_machine_id_info) > 1
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} nodes share /etc/machine-id (cloned VMs)"
        - alert: PtkNodeStorageCheckFailed
          expr: ptk_node_check_status == 2
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.node }}: storage check {{ $labels.check }} failing"
            description: "curl <pod-ip>:9110/report on the node's ptk-node-check pod for details."
        - alert: PtkNodeStorageCheckWarning
          expr: ptk_node_check_status == 1
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.node }}: storage check {{ $labels.check }} not at Pure recommended value"
        - alert: PtkNodeCheckMissing
          expr: count(kube_node_info) - count(ptk_node_ready) > 0
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} node(s) are not reporting ptk node checks"
        - alert: PtkMultipathDegraded
          # Adds namespace/pvc when the audit knows the volume; falls back to wwid.
          expr: >-
            ((ptk_multipath_paths_running < 2) * on (wwid) group_left (namespace, pvc) ptk_pvc_volume_info)
            or (max without (namespace) (ptk_multipath_paths_running < 2) unless on (wwid) ptk_pvc_volume_info)
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.node }}: {{ if $labels.pvc }}{{ $labels.namespace }}/{{ $labels.pvc }} {{ end }}volume {{ $labels.wwid }} has {{ $value }} running path(s)"
    - name: ptk.cluster
      rules:
        - alert: PtkEtcdProcessCount
          # Host view: how many nodes run an etcd process. It cannot see members that
          # exist in etcd but run nowhere (the w08 case); scripts/etcd-members.sh can.
          expr: count(ptk_node_etcd_running == 1) != 3
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "{{ $value }} nodes run etcd; this cluster expects exactly 3 (c01, c02, c03)"
            description: "Run scripts/etcd-members.sh on a control-plane node to see the actual membership."
        - alert: PtkNodeRoleMismatch
          # kube-state-metrics role labels vs. what the host actually runs.
          expr: >-
            kube_node_role{role=~"etcd|control-plane|master"}
            * on (node) group_left (mode) ptk_node_rke2_mode_info{mode="agent"}
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.node }} is labelled {{ $labels.role }} but runs rke2-agent"
            description: >-
              Stale server-role labels. If this node is still an etcd member, remove the member
              first (docs/runbooks/etcd-remove-stale-member.md), then remove the labels.
    - name: ptk.health
      rules:
        - alert: PtkHealthAreaRed
          expr: ptk_health_area_status == 2
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.area }} is RED"
            description: "Details: curl http://<control-plane-node>:9112/report, or journalctl -u ptk-health on c01."
        - alert: PtkEtcdMemberCount
          expr: ptk_etcd_members != 3
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "etcd has {{ $value }} members; this cluster is designed for exactly 3 (c01, c02, c03)"
        - alert: PtkEtcdUnexpectedMember
          expr: ptk_etcd_member_healthy{expected="false"} >= 0
          labels: {severity: critical}
          annotations:
            summary: "etcd member {{ $labels.member_id }} ({{ $labels.host }}) is not a control-plane node"
            description: "Remove the membership first, then its role labels: docs/runbooks/etcd-remove-stale-member.md"
        - alert: PtkEtcdNoFailureTolerance
          expr: ptk_etcd_failure_tolerance < 1
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "etcd cannot survive another member failure (tolerance {{ $value }}); pause control-plane maintenance"
        - alert: PtkEtcdNoLeader
          expr: ptk_etcd_has_leader == 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "etcd reports no leader"
        - alert: PtkEtcdLeaderChurn
          expr: changes(ptk_etcd_raft_term[1h]) > 3
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} etcd leader elections in the last hour; check peer connectivity on TCP 2380"
        - alert: PtkCiliumAgentsNotReady
          expr: ptk_cilium_agents_ready < ptk_cilium_agents_desired
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Only {{ $value }} Cilium agents Ready; pods on the other nodes lose Service routing"
        - alert: PtkServiceRouteBroken
          expr: ptk_node_service_route_ok == 0
          for: 3m
          labels: {severity: critical}
          annotations:
            summary: "Pods on {{ $labels.node }} cannot reach {{ $labels.target }}"
            description: >-
              Service routing on this node is broken (the rancher-webhook failure mode:
              GET https://10.43.0.1/version i/o timeout). Check the Cilium agent on the node.
        - alert: PtkHealthStale
          expr: time() - ptk_health_last_run_timestamp_seconds > 600
          labels: {severity: warning}
          annotations:
            summary: "ptk health has not completed a run in 10 minutes"
    - name: ptk.kata
      rules:
        - alert: PtkKataNodeNotCapable
          # containerd has a Kata handler, but the VM cannot start nested VMs:
          # Kata pods scheduled here will fail to start.
          expr: (ptk_node_kata_capable == 0) and on (node) (count by (node) (ptk_node_kata_runtime_info))
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "{{ $labels.node }} has Kata configured but no nested virtualization (/dev/kvm)"
            description: >-
              Power the VM off in vCenter and enable CPU > 'Expose hardware assisted
              virtualization to the guest OS', or keep Kata pods off this node.
        - alert: PtkKataCoverageLow
          expr: count by (handler) (ptk_node_kata_runtime_info and on (node) (ptk_node_kata_capable == 1)) < 2
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Only {{ $value }} working node(s) offer Kata handler {{ $labels.handler }}; no room to drain one"
    - name: ptk.audit
      rules:
        - alert: PtkPvMissingOnArray
          expr: ptk_pv_missing_on_array == 1
          for: 15m
          labels: {severity: critical}
          annotations:
            summary: "PV {{ $labels.pv }} ({{ $labels.namespace }}/{{ $labels.pvc }}) has no volume on any FlashArray"
        - alert: PtkPvVolumeDestroyed
          expr: ptk_pv_volume_destroyed == 1
          labels: {severity: critical}
          annotations:
            summary: "Volume for {{ $labels.namespace }}/{{ $labels.pvc }} is in the destroyed bucket on {{ $labels.array }}; recover it before eradication"
        - alert: PtkOrphanArrayVolumes
          expr: ptk_array_orphan_volumes > 0
          for: 24h
          labels: {severity: warning}
          annotations:
            summary: "{{ $value }} CSI-created FlashArray volume(s) have no PV. See /report on ptk-audit."
        - alert: PtkArrayApiDown
          expr: ptk_array_up == 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "ptk-audit cannot reach FlashArray {{ $labels.array }}: {{ $labels.error }}"
        - alert: PtkAuditStale
          expr: time() - ptk_audit_last_success_timestamp_seconds > 3600
          labels: {severity: warning}
          annotations:
            summary: "ptk-audit has not completed a full pass in over an hour"
