apiVersion: v1
kind: ConfigMap
metadata:
  name: ptk-policy
  namespace: ptk-system
data:
  # Overrides merged over ptk/policy.py defaults. Set protocol to match how
  # the nodes reach the FlashArray: iscsi | nvme-tcp | fc | any.
  policy.json: |
    {
      "protocol": "iscsi",
      "min_paths": 2
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ptk-node-check
  namespace: ptk-system
  labels: {app.kubernetes.io/name: ptk-node-check}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: ptk-node-check}
  updateStrategy:
    rollingUpdate: {maxUnavailable: 25%}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ptk-node-check}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ptk-node-check
      hostPID: true                     # to see multipathd / iscsid
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists              # all 16 nodes, including control plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: node-check
          image: registry.example.local/platform/ptk:0.1.0   # your internal registry
          args: ["node-check"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: PTK_POLICY_FILE, value: /etc/ptk/policy.json}
            - {name: PTK_INTERVAL, value: "300"}
          ports:
            - {name: metrics, containerPort: 9110}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: host-etc, mountPath: /host/etc, readOnly: true}
            - {name: host-sys, mountPath: /host/sys, readOnly: true}
            - {name: policy, mountPath: /etc/ptk}
      volumes:
        - name: host-etc
          hostPath: {path: /etc, type: Directory}
        - name: host-sys
          hostPath: {path: /sys, type: Directory}
        - name: policy
          configMap: {name: ptk-policy}
