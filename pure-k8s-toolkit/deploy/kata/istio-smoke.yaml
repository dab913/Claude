                    try:
                        resp = direct.open("http://smoke-server:8080/", timeout=5)
                        server = resp.headers.get("server", "")
                        print("status", resp.status, "server header", repr(server))
                        ok = resp.status == 200 and "envoy" in server
                        break
                    except Exception as exc:
                        print("attempt", attempt, type(exc).__name__, exc)
                        time.sleep(3)
                try:  # stop the sidecar so the Job can complete
